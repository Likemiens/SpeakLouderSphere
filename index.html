<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>SpeakLouderSphere — демо и настройка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">SpeakLouderSphere</span>
      <button class="pill" id="open-panel" type="button" aria-expanded="false" aria-controls="panel">Настроить</button>
    </header>

    <main class="stage">
      <speak-louder-sphere
        id="sphere"
        lang="ru-RU"
        text="Привет! Нажми на сферу и начни говорить"
        listening-text="Говорите, я слушаю…"
      ></speak-louder-sphere>
    </main>

    <p class="footnote">Микрофон включается кликом по сфере. Субтитры работают в Chrome, Edge и Safari.</p>

    <aside class="panel" id="panel" aria-label="Настройки сферы" hidden>
      <div class="panel-head">
        <h2>Настройки</h2>
        <button class="icon-btn" id="close-panel" type="button" aria-label="Закрыть">✕</button>
      </div>

      <section>
        <h3>Пресет</h3>
        <div class="presets" id="presets" role="radiogroup" aria-label="Пресет"></div>
      </section>

      <section>
        <h3>Цвета</h3>
        <div class="colors" id="colors"></div>
        <button class="link-btn" id="reset-colors" type="button">Сбросить к пресету</button>
      </section>

      <section>
        <h3>Поведение</h3>
        <label class="field">
          <span>Размер <output id="size-out"></output></span>
          <input type="range" id="size" min="160" max="560" step="10" value="340" />
        </label>
        <label class="field">
          <span>Чувствительность микрофона <output id="sensitivity-out"></output></span>
          <input type="range" id="sensitivity" min="0.3" max="3" step="0.1" value="1" />
        </label>
        <label class="field">
          <span>Скорость анимации <output id="speed-out"></output></span>
          <input type="range" id="speed" min="0" max="3" step="0.1" value="1" />
        </label>
        <label class="field">
          <span>Язык распознавания</span>
          <select id="lang">
            <option value="ru-RU">Русский</option>
            <option value="en-US">English (US)</option>
            <option value="uk-UA">Українська</option>
            <option value="kk-KZ">Қазақ тілі</option>
            <option value="de-DE">Deutsch</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
          </select>
        </label>
        <label class="switch"><input type="checkbox" id="captions" checked /> <span>Субтитры под сферой</span></label>
        <label class="switch"><input type="checkbox" id="simulate" /> <span>Имитация речи (без микрофона)</span></label>
      </section>

      <section>
        <h3>Тексты</h3>
        <label class="field">
          <span>Когда микрофон выключен</span>
          <input type="text" id="text" />
        </label>
        <label class="field">
          <span>Пока слушает</span>
          <input type="text" id="listening-text" />
        </label>
      </section>

      <section>
        <h3>Фон страницы</h3>
        <div class="backgrounds" id="backgrounds">
          <button type="button" data-bg="#000000" data-fg="#ffffff" aria-label="Чёрный" aria-pressed="true"></button>
          <button type="button" data-bg="#0b1020" data-fg="#e8ecff" aria-label="Тёмно-синий"></button>
          <button type="button" data-bg="#f4f5f8" data-fg="#10131a" aria-label="Светлый"></button>
        </div>
      </section>

      <section>
        <h3>Код для сайта</h3>
        <pre class="code"><code id="snippet"></code></pre>
        <button class="pill wide" id="copy" type="button">Скопировать</button>
      </section>
    </aside>

    <script type="module" src="/demo/demo.ts"></script>
  </body>
</html>
