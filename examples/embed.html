<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpeakLouderSphere — embed with one tag</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; }
      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
      }
      speak-louder-sphere { --sls-font-size: clamp(17px, 2.4vw, 32px); }
    </style>
  </head>
  <body>
    <!-- 1. One file, no dependencies. On your own site use the hosted URL or your own copy. -->
    <script src="../dist/speak-louder-sphere.iife.js"></script>

    <!-- 2. The widget itself: put it anywhere on the page. -->
    <speak-louder-sphere
      size="380"
      lang="en-US"
      text="Hi! I'm a talking sphere. Tap me and say something."
      listening-text="Listening…"
    ></speak-louder-sphere>
  </body>
</html>
